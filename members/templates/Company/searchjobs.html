<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Job Portal / Recruitment Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{

    background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=1600") no-repeat center center fixed;
    background-size:cover;
    min-height:100vh;

}

.overlay{

    width:100%;
    min-height:100vh;
    background:rgba(0,0,0,0.60);
    display:flex;
    justify-content:center;
    align-items:center;

}

.search-box{

    width:450px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);

}

.icon{

    text-align:center;
    font-size:60px;
    margin-bottom:10px;

}

h1{

    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:38px;

}

label{

    display:block;
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;

}

input[type=text]{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
    margin-bottom:25px;
    background:rgba(255,255,255,0.92);

}

input[type=text]:focus{

    box-shadow:0 0 10px #00d4ff;

}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#0072ff,#00c6ff);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.4s;

}

button:hover{

    background:linear-gradient(45deg,#ff512f,#dd2476);
    transform:translateY(-3px);

}

.footer{

    margin-top:20px;
    text-align:center;
    color:white;
    font-size:16px;

}

@media(max-width:600px){

.search-box{

width:90%;
padding:25px;

}

h1{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="overlay">

<div class="search-box">

<div class="icon">
🔍
</div>

<form action="{% url 'searchjobsprocess' %}" method="post">

{% csrf_token %}

<h1>Online Job Portal / Recruitment Management System</h1>

<label>Job ID</label>

<input
type="text"
name="jobid"
placeholder="Enter Job ID">

<button type="submit">
🔎 Search Job
</button>

</form>

<div class="footer">

<p>💼 Find the Perfect Career Opportunity</p>

</div>

</div>

</div>

</body>
</html>
