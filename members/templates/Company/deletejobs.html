
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Job Portal / Recruitment Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{

    background:url("https://images.unsplash.com/photo-1497366811353-6870744d04b2?w=1600") no-repeat center center fixed;
    background-size:cover;
    min-height:100vh;

}

.overlay{

    width:100%;
    min-height:100vh;
    background:rgba(0,0,0,0.60);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;

}

.card{

    width:500px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);

}

.icon{

    text-align:center;
    font-size:60px;
    margin-bottom:10px;

}

h1{

    text-align:center;
    color:white;
    font-size:36px;
    margin-bottom:25px;

}

.back{

    display:inline-block;
    text-decoration:none;
    color:white;
    background:linear-gradient(45deg,#6a11cb,#2575fc);
    padding:10px 18px;
    border-radius:10px;
    margin-bottom:20px;
    font-weight:bold;
    transition:0.3s;

}

.back:hover{

    transform:translateY(-2px);

}

label{

    display:block;
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;

}

input[type=number]{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
    background:rgba(255,255,255,0.92);
    margin-bottom:20px;

}

input[type=number]:focus{

    box-shadow:0 0 10px #00d4ff;

}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#ff512f,#dd2476);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.4s;

}

button:hover{

    background:linear-gradient(45deg,#ff0000,#b30000);
    transform:translateY(-3px);

}

.msg{

    text-align:center;
    color:#ffff66;
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;

}

.footer{

    text-align:center;
    color:white;
    margin-top:20px;
    font-size:16px;

}

@media(max-width:600px){

.card{

width:95%;
padding:25px;

}

h1{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="overlay">

<div class="card">

<div class="icon">
🗑️💼
</div>

<a class="back" href="{% url 'companydashboard' %}">
🏠 Back to Dashboard
</a>

<h1>Online Job Portal / Recruitment Management System</h1>

{% if msg %}

<div class="msg">

{{ msg }}

</div>

{% endif %}

<form action="{% url 'deletejobprocess' %}" method="post">

{% csrf_token %}

<label>Job ID</label>

<input
type="number"
name="jobid"
placeholder="Enter Job ID to Delete"
required>

<button type="submit">

🗑️ Delete Job

</button>

</form>

<div class="footer">

<p>🏢 Manage Job Listings Efficiently and Keep Your Portal Updated</p>

</div>

</div>

</div>

</body>
</html>
