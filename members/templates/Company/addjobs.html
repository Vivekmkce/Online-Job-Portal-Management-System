
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Job Portal / Recruitment Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{

    background:url("https://images.unsplash.com/photo-1517048676732-d65bc937f952?w=1600") no-repeat center center fixed;
    background-size:cover;
    min-height:100vh;

}

.overlay{

    width:100%;
    min-height:100vh;
    background:rgba(0,0,0,0.55);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;

}

.container{

    width:550px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:40px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.5);

}

.logo{

    text-align:center;
    font-size:60px;
    margin-bottom:10px;

}

h1{

    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:38px;

}

label{

    display:block;
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;

}

input[type=text],
input[type=number],
textarea{

    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    outline:none;
    margin-bottom:20px;
    font-size:16px;
    background:rgba(255,255,255,0.92);

}

textarea{

    height:120px;
    resize:none;

}

input:focus,
textarea:focus{

    box-shadow:0 0 10px #00d4ff;

}

input[type=submit]{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#0072ff,#00c6ff);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.4s;

}

input[type=submit]:hover{

    background:linear-gradient(45deg,#ff512f,#dd2476);
    transform:translateY(-3px);

}

.footer{

    text-align:center;
    color:white;
    margin-top:20px;
    font-size:16px;

}

@media(max-width:600px){

.container{

width:95%;
padding:25px;

}

h1{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="overlay">

<div class="container">

<div class="logo">
💼
</div>

<h1>Online Job Portal / Recruitment Management System</h1>

<form action="{% url 'addjobprocess' %}" method="post">

{% csrf_token %}

<label>Job Title</label>
<input type="text"
name="title"
placeholder="Enter Job Title"
required>

<label>Company Name</label>
<input type="text"
name="company"
placeholder="Enter Company Name"
required>

<label>Location</label>
<input type="text"
name="location"
placeholder="Enter Job Location"
required>

<label>Salary</label>
<input type="number"
name="salary"
placeholder="Enter Salary"
required>

<label>Job Description</label>

<textarea
name="description"
placeholder="Enter Job Description"
required></textarea>

<input type="submit" value="➕ Add Job">

</form>

<div class="footer">

<p>🚀 Post New Opportunities & Find the Best Talent</p>

</div>

</div>

</div>

</body>
</html>
