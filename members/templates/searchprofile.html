
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Job Portal / Recruitment Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=1600") no-repeat center center fixed;
    background-size:cover;
    height:100vh;

}

.overlay{

    width:100%;
    height:100vh;
    background:rgba(0,0,0,0.55);
    display:flex;
    justify-content:center;
    align-items:center;

}

.container{

    width:450px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    box-shadow:0px 10px 30px rgba(0,0,0,0.5);

}

h1{

    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:32px;

}

label{

    color:white;
    font-size:18px;
    font-weight:bold;

}

input[type=text]{

    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
    background:rgba(255,255,255,0.9);

}

input[type=text]:focus{

    box-shadow:0px 0px 10px #00e5ff;

}

input[type=submit]{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    background:linear-gradient(45deg,#0072ff,#00c6ff);
    transition:0.4s;

}

input[type=submit]:hover{

    background:linear-gradient(45deg,#ff512f,#dd2476);
    transform:translateY(-3px);

}

.footer{

    margin-top:20px;
    text-align:center;
    color:white;
    font-size:16px;

}

.back-btn{

    display:inline-block;
    margin-bottom:20px;
    padding:10px 18px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    background:linear-gradient(45deg,#7f00ff,#e100ff);
    font-weight:bold;

}

.back-btn:hover{

    background:linear-gradient(45deg,#ff512f,#dd2476);

}

</style>

</head>

<body>

<div class="overlay">

<div class="container">

<a class="back-btn" href="{% url 'dashboard' %}">← Back to Dashboard</a>

<h1>Online Job Portal / Recruitment Management System</h1>

<form method="post" action="{% url 'searchprofileprocess' %}">

{% csrf_token %}

<label>Seeker ID</label>

<input type="text"
name="seekerid"
placeholder="Enter Seeker ID">

<label>Email</label>

<input type="text"
name="email"
placeholder="Enter Email Address">

<input type="submit" value="Search Profile">

</form>

<div class="footer">

<p>💼 Find the Right Candidate Quickly</p>

</div>

</div>

</div>

</body>
</html>
