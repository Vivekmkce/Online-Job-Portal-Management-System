<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Job Portal / Recruitment Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:url("https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1600") no-repeat center center/cover;

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(rgba(10,30,80,0.6),rgba(120,20,150,0.5));
}

.login-box{

    position:relative;
    width:380px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    color:white;

}

.login-box h1{

    text-align:center;
    margin-bottom:30px;
    font-size:34px;
    color:#fff;

}

.input-box{

    margin-bottom:20px;

}

.input-box label{

    display:block;
    margin-bottom:8px;
    font-size:17px;
    font-weight:bold;

}

.input-box input{

    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
    background:rgba(255,255,255,0.9);

}

.password-box{

    position:relative;

}

.password-box input{

    width:100%;
    padding-right:48px;

}

.password-box button{

    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    width:auto;
    padding:0;
    border:none;
    background:transparent;
    color:#666;
    cursor:pointer;
    transition:.3s;
    font-size:24px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;

}

.password-box button:hover{

    background:transparent;
    color:#222;

}

.login-btn{

    width:100%;
    padding:14px;
    background:linear-gradient(to right,#007bff,#6610f2);
    border:none;
    color:white;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;

}

.login-btn:hover{

    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(0,0,0,.3);

}

.bottom{

    margin-top:20px;
    text-align:center;
    font-size:15px;

}

.bottom a{

    color:#FFD700;
    text-decoration:none;
    font-weight:bold;

}

.bottom a:hover{

    text-decoration:underline;

}

.icon{

    text-align:center;
    font-size:60px;
    margin-bottom:10px;

}

@media(max-width:500px){

.login-box{

width:90%;
padding:25px;

}

}
</style>

</head>

<body>

<div class="login-box">

<div class="icon">
💼
</div>

<h1>Online Job Portal / Recruitment Management System</h1>

<form action="{% url 'jobseekerloginprocess' %}" method="post">

{% csrf_token %}

<div class="input-box">

<label>Email Address</label>

<input type="email" name="email" placeholder="Enter your email" required>

</div>

<div class="input-box">

<label>Password</label>

<div class="password-box">

<input type="password" name="password" id="password-field" placeholder="Enter your password" required>

<button type="button" id="toggle-password" aria-label="Show password">👁</button>

</div>

</div>

<input type="submit" value="Login" class="login-btn">

<div class="bottom" style="color:#ffeb99;min-height:24px;">
{{ msg }}
</div>

<div class="bottom">

<p>Don't have an account?
<a href="{% url 'jobseekerregister' %}">Register Now</a>
</p>

</div>

<div class="bottom" style="margin-top:12px;">
<a href="{% url 'companylogin' %}">Company login</a>
</div>

</form>

</div>

<script>

const passwordField = document.getElementById("password-field");
const togglePassword = document.getElementById("toggle-password");

togglePassword.addEventListener("click",function(){

if(passwordField.type==="password"){

passwordField.type="text";
togglePassword.innerHTML="🙈";
togglePassword.setAttribute("aria-label","Hide password");

}
else{

passwordField.type="password";
togglePassword.innerHTML="👁";
togglePassword.setAttribute("aria-label","Show password");

}

});

</script>

</body>
</html>
