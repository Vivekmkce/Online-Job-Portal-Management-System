
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Job Portal / Recruitment Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600") no-repeat center center fixed;
    background-size:cover;
    min-height:100vh;

}

.overlay{

    width:100%;
    min-height:100vh;
    background:rgba(0,0,0,0.55);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;

}

.container{

    width:500px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:35px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.5);

}

.section-title{

    color:white;
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;

}

.form-group{

    margin-bottom:16px;

}

h1{

    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:32px;

}

label{

    display:block;
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;

}

input[type=text],
input[type=email],
input[type=file]{

    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:18px;
    outline:none;
    font-size:16px;
    background:rgba(255,255,255,0.9);

}

input[type=text]:focus,
input[type=email]:focus{

    box-shadow:0 0 10px #00e5ff;

}

button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    background:linear-gradient(45deg,#0072ff,#00c6ff);
    transition:0.4s;

}

button:hover{

    background:linear-gradient(45deg,#ff512f,#dd2476);
    transform:translateY(-3px);

}

.footer{

    text-align:center;
    color:white;
    margin-top:20px;
    font-size:16px;

}

.back-btn,
.submit-btn{

    display:block;

}

.back-btn{

    display:inline-block;
    margin-bottom:20px;
    padding:10px 18px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    background:linear-gradient(45deg,#7f00ff,#e100ff);
    font-weight:bold;

}

.back-btn:hover{

    background:linear-gradient(45deg,#ff512f,#dd2476);

}

</style>

</head>

<body>

<div class="overlay">

<div class="container">


<a class="back-btn" href="{% url 'dashboard' %}">← Back to Dashboard</a>

<div class="section-title">Edit Profile Details</div>

<form method="post" action="{% url 'modifyprofileprocess' %}" enctype="multipart/form-data">

{% csrf_token %}


{% if error_message %}
<p style="color:#ffdddd;font-weight:bold;text-align:center;margin-bottom:18px;">{{ error_message }}</p>
{% endif %}

<input type="hidden" name="seekerid" value="{{ profile.seekerid|default:'' }}">

<div class="form-group">
<label>Name</label>
<input type="text" name="name" placeholder="Enter your name" value="{{ profile.name|default:'' }}">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" placeholder="Enter your email" value="{{ profile.email|default:'' }}">
</div>

<div class="form-group">
<label>Phone</label>
<input type="text" name="phone" placeholder="Enter your phone number" value="{{ profile.phone|default:'' }}">
</div>

<div class="form-group">
<label>Skills</label>
<input type="text" name="skills" placeholder="Enter your skills" value="{{ profile.skills|default:'' }}">
</div>

<div class="form-group">
<label>Resume</label>
<input type="file" name="resume">
</div>

<button type="submit" class="submit-btn">🚀 Update Profile</button>

</form>

<div class="footer">

<p>💼 Keep Your Profile Updated for Better Job Opportunities</p>

</div>

</div>

</div>

</body>
</html>
